name: Rebuild archive index once

on:
  push:
    paths:
      - '.github/workflows/rebuild-index-once.yml'

permissions:
  contents: write

jobs:
  build-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Rebuild index
        run: node scripts/build-index.cjs
      - name: Commit generated index
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Build index for September 3 archive update"
          git push
