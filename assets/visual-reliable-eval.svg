  <path d="M350 412V100M350 412H730"/>
</g>
<g fill="none" stroke="#9C5A3C" stroke-width="4">
  <circle cx="435" cy="335" r="8"/><circle cx="478" cy="275" r="8"/><circle cx="515" cy="300" r="8"/><circle cx="552" cy="220" r="8"/><circle cx="590" cy="250" r="8"/><circle cx="633" cy="170" r="8"/><circle cx="680" cy="205" r="8"/>
  <path d="M556 125v260"/>
