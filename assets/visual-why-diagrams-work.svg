<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 533" role="img" aria-labelledby="t d">
<title id="t">Diagram and sentence representation visual</title><desc id="d">The same pieces of information are shown once as a long sequence and once as spatially grouped elements, highlighting different search costs.</desc>
<rect width="800" height="533" fill="#EFEFE8"/>
<g fill="none" stroke="#2D4A3E" stroke-width="3">
  <rect x="70" y="105" width="275" height="320"/><rect x="455" y="105" width="275" height="320"/>
</g>
<g stroke="#9C5A3C" stroke-width="3" fill="none">
  <line x1="105" y1="165" x2="310" y2="165"/><line x1="105" y1="215" x2="285" y2="215"/><line x1="105" y1="265" x2="300" y2="265"/><line x1="105" y1="315" x2="270" y2="315"/><line x1="105" y1="365" x2="305" y2="365"/>
</g>
<g fill="#EFEFE8" stroke="#4A7C6F" stroke-width="3">
  <circle cx="535" cy="190" r="38"/><circle cx="650" cy="190" r="38"/><circle cx="535" cy="330" r="38"/><circle cx="650" cy="330" r="38"/>
</g>
<g stroke="#4A7C6F" stroke-width="3"><line x1="573" y1="190" x2="612" y2="190"/><line x1="535" y1="228" x2="535" y2="292"/><line x1="650" y1="228" x2="650" y2="292"/><line x1="573" y1="330" x2="612" y2="330"/></g>
<g fill="#3B4A63" font-family="serif" text-anchor="middle"><text x="207" y="80" font-size="21">SEQUENCE</text><text x="592" y="80" font-size="21">SPATIAL GROUPING</text><text x="207" y="465" font-size="16">search across statements</text><text x="592" y="465" font-size="16">relations visible together</text></g>
</svg>
