<g transform="translate(652 310)" stroke="#20314d" stroke-width="3"><rect width="123" height="119" fill="#d7cfba"/><path d="M0 0l61-42L123 0" fill="#8a4937"/><rect x="17" y="19" width="89" height="42" fill="#e7ddc5"/><path d="M31 86l12-38M56 86l7-39M81 86l-3-38M102 86l-13-36"/><circle cx="43" cy="48" r="5" fill="#60704f"/><circle cx="63" cy="47" r="5" fill="#8a4937"/><circle cx="78" cy="48" r="5" fill="#60704f"/><circle cx="89" cy="50" r="5" fill="#8a4937"/></g>
<!-- sample balls showing repeated rollouts -->
<g transform="translate(548 455)" fill="#60704f" stroke="#20314d" stroke-width="2"><circle cx="0" cy="0" r="11"/><circle cx="30" cy="10" r="11"/><circle cx="60" cy="-4" r="11"/><circle cx="90" cy="13" r="11"/><circle cx="120" cy="-2" r="11"/><circle cx="150" cy="10" r="11"/></g><g transform="translate(548 491)" fill="#8a4937" stroke="#20314d" stroke-width="2"><circle cx="0" cy="0" r="11"/><circle cx="30" cy="10" r="11"/><circle cx="60" cy="-4" r="11"/></g>
<!-- track ties -->
<rect y="210" width="800" height="323" fill="url(#ties)" opacity=".22"/>
</svg>